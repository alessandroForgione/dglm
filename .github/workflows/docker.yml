name: Build, push image & bump deployment

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: write     # per committare il nuovo tag in k8s/deployment.yaml
  packages: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome immagine (ghcr vuole minuscolo)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dglm-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: latest=true
          tags: |
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps: aggiorna il tag nel manifest → ArgoCD fa il rollout
      - name: Bump tag in k8s/deployment.yaml
        env:
          IMAGE: ${{ steps.img.outputs.name }}
        run: |
          TAG="sha-$(git rev-parse --short=7 HEAD)"
          sed -i -E "s#image: ghcr\.io/[^ ]+/dglm-web:[^ ]+#image: ${IMAGE}:${TAG}#" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "nessun cambiamento"; exit 0; fi
          git commit -am "deploy: dglm-web ${TAG} [skip ci]"
          git push
          echo "→ ${IMAGE}:${TAG}"
