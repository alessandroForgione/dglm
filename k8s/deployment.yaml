apiVersion: apps/v1
kind: Deployment
metadata:
  name: dglm-web
  namespace: dglm
  labels: { app: dglm-web }
spec:
  replicas: 1                 # SQLite su volume RWO: una sola replica
  strategy:
    type: Recreate            # evita due pod sullo stesso volume durante il rollout
  selector:
    matchLabels: { app: dglm-web }
  template:
    metadata:
      labels: { app: dglm-web }
    spec:
      # Decommenta se il package ghcr è privato (vedi scripts/k8s-secrets.sh)
      # imagePullSecrets:
      #   - name: ghcr
      securityContext:
        fsGroup: 1001
      containers:
        - name: web
          image: ghcr.io/alessandroforgione/dglm-web:sha-82a9a43
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: dglm-web-env
          env:
            - name: DATABASE_PATH
              value: /data/dglm.db
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dglm-data
